<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FF Cutting Spec Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
<meta property="og:title" content="FF Cutting Spec Portal">
<meta property="og:description" content="Product cutting specifications &mdash; Meat Me At Home / Freedown Food">
<meta property="og:image" content="https://montymmah.github.io/fh-spec-portal/og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23821E20'/%3E%3Ctext x='50' y='68' font-family='Arial, sans-serif' font-size='46' font-weight='bold' fill='white' text-anchor='middle'%3EFF%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --ink:#39130F; --red:#821E20; --grey1:#6b5f56; --grey2:#8a7d72; --grey3:#a39587;
    --line:#ddd0bd; --panel:#F2F2F2; --highlight:#ECDDDE; --bg:#FFFFFF; --page-bg:#F2EBDD;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#1c1c1c; --panel:#2a2a2a; --line:#444; --ink:#f0f0f0; }
  }
  :root[data-theme="dark"]{ --bg:#1c1c1c; --panel:#2a2a2a; --line:#444; --ink:#f0f0f0; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--page-bg,var(--bg)); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:980px;margin:0 auto;padding:16px 16px 60px;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;padding-top:8px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .brand{font-family:var(--serif);font-weight:800;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand-sep{display:inline-block;width:1px;height:28px;background:var(--line);}
  .brand-title{font-size:22px;color:var(--red);}
  .brand-logo{height:26px;width:auto;display:block;}
  .brand span{color:var(--red);}
  .subnote{font-size:12px;color:var(--grey2);margin-bottom:18px;}
  .nav{display:flex;gap:8px;flex-wrap:wrap;}
  button, .btn{
    font-family:inherit; cursor:pointer; border:1px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:8px; padding:9px 14px; font-size:13.5px; font-weight:600; transition:.15s;
  }
  button:hover{border-color:var(--ink);}
  .btn-primary{background:var(--red);border-color:var(--red);color:#fff;}
  .btn-primary:hover{opacity:.9;}
  .btn-dark{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--grey1);}
  .btn-sm{padding:6px 10px;font-size:12.5px;}
  input[type=text],input[type=number],input[type=date],textarea,select{
    width:100%; font-family:inherit; font-size:14px; padding:9px 10px; border:1px solid var(--line);
    border-radius:6px; background:var(--bg); color:var(--ink);
  }
  textarea{resize:vertical;min-height:60px;}
  label.field-label{display:block;font-weight:700;font-size:12px;color:var(--grey1);text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px;}
  .field{margin-bottom:16px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:180px;}
  .card{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.045);}
  .search-bar{margin-bottom:16px;display:flex;gap:8px;}
  .search-bar input{flex:1;}
  .catalog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .catalog-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.045);}
  .catalog-thumb{width:100%;height:140px;object-fit:cover;background:var(--panel);display:block;cursor:zoom-in;}
  .catalog-thumb-ph{width:100%;height:140px;background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--grey3);font-size:28px;}
  .catalog-body{padding:12px 14px;flex:1;display:flex;flex-direction:column;}
  .catalog-body h3{margin:0 0 2px;font-size:14.5px;}
  .catalog-sage{font-size:12.5px;color:var(--grey1);margin-bottom:6px;min-height:16px;}
  .catalog-meta{font-size:11.5px;color:var(--grey2);margin-bottom:10px;}
  /* ---- landing page ---- */
  .home-title{font-family:var(--serif);font-size:38px;line-height:1.15;text-align:center;margin:30px 0 8px;}
  .home-sub{text-align:center;color:var(--grey1);margin:0 0 28px;font-size:15px;}
  .channel-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:34px;}
  @media (max-width:720px){ .channel-cards{grid-template-columns:1fr;} .home-title{font-size:30px;} }
  .ch-card{position:relative;display:flex;flex-direction:column;min-height:200px;padding:26px 28px;border:1px solid var(--line);border-radius:18px;background:#fff;cursor:pointer;transition:.15s;}
  .ch-card:hover{box-shadow:0 8px 24px rgba(57,19,15,.13);transform:translateY(-1px);}
  .ch-card.last{background:var(--ink);border-color:var(--ink);color:#fff;}
  .ch-eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;text-transform:uppercase;color:var(--red);}
  .ch-card.last .ch-eyebrow{color:#e6d3cf;}
  .ch-name{font-family:var(--serif);font-size:38px;line-height:1.1;font-weight:800;margin:12px 0 10px;}
  .ch-desc{font-size:14.5px;line-height:1.5;color:var(--grey1);margin:0 0 18px;}
  .ch-card.last .ch-desc{color:#e9dcd8;}
  .ch-logo{display:flex;align-items:center;justify-content:center;align-self:flex-start;box-sizing:border-box;width:260px;max-width:100%;height:132px;background:#fff;border-radius:12px;padding:10px 16px;margin:4px 0 18px;}
  .ch-logo img{display:block;width:auto;max-width:100%;object-fit:contain;}
  .ch-logo.ff img{height:76px;}      /* the Freedown Food file is small (206px wide) — any bigger and it goes blurry */
  .ch-logo.mm img{height:104px;}     /* the emblem is narrower than the Freedown Food logo, so it is a little taller to match its visual size */
  .ch-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .ch-chips{display:flex;gap:8px;flex-wrap:wrap;}
  .ch-chip{background:var(--page-bg);border-radius:8px;padding:6px 11px;font-size:12.5px;color:var(--ink);}
  .ch-card.last .ch-chip{background:rgba(255,255,255,.13);color:#fff;}
  .ch-open{font-weight:800;color:var(--red);}
  .ch-card.last .ch-open{color:#fff;}
  .last-badge{position:absolute;top:22px;right:24px;background:rgba(255,255,255,.15);border-radius:14px;padding:5px 12px;font-size:12px;font-weight:700;}
  .home-label{display:block;font-size:12.5px;font-weight:700;color:var(--grey1);margin-bottom:8px;}
  .home-search{position:relative;margin-bottom:28px;}
  .home-search input{padding:15px 16px 15px 46px;border-radius:12px;font-size:15px;}
  .home-search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--grey2);}
  .recent-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .recent-head b{font-size:12px;letter-spacing:.1em;color:var(--grey1);text-transform:uppercase;}
  .recent-head span{font-size:13px;font-weight:700;color:var(--red);text-decoration:underline;cursor:pointer;}
  .recent-list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .recent-row{display:grid;grid-template-columns:130px 1fr 150px 110px;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px;}
  .recent-row:last-child{border-bottom:none;}
  .recent-row:hover{background:var(--page-bg);}
  .recent-name{font-weight:700;}
  .recent-sku,.recent-date{color:var(--grey1);font-size:13.5px;}
  .recent-date{text-align:right;}
  @media (max-width:720px){ .recent-row{grid-template-columns:1fr;gap:4px;} .recent-date{text-align:left;} }
  .chan-badge.retail{background:var(--ink);}
  .chan-badge.mmah{background:#ba5c08;}
  .chan-badge{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;padding:3px 9px;font-size:11px;font-weight:800;letter-spacing:.04em;margin-right:4px;text-transform:uppercase;}
  .wb-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;}
  @media (max-width:900px){ .wb-grid{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media (max-width:560px){ .wb-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .wb-cell{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);}
  .wb-label{font-size:11px;font-weight:800;color:var(--grey1);text-transform:uppercase;letter-spacing:.02em;margin-bottom:6px;min-height:28px;}
  .wb-cell input{margin-bottom:6px;}
  .spec-sheet .ss-wbtitle{font-weight:700;font-size:13px;margin:4px 0 8px;}
  .spec-sheet .ss-andor{color:#606060;font-style:italic;font-size:12px;}
  .spec-sheet .wb4 td{width:25%;padding:10px 4px;}
  .spec-sheet .wb5 td{width:20%;padding:10px 4px;}
  .spec-sheet .wb5 .v{font-size:19px;}
  .field.has-error{outline:2px solid var(--red);outline-offset:6px;border-radius:6px;}
  .field .field-err{display:none;color:var(--red);font-size:12px;font-weight:700;margin-top:6px;}
  .field.has-error .field-err{display:block;}
  .tabs{display:flex;align-items:center;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);}
  .tab{border:none;border-bottom:3px solid transparent;border-radius:0;background:none;padding:8px 16px;color:var(--grey1);font-weight:700;}
  .tab:hover{border-color:transparent;border-bottom-color:var(--line);}
  .tab.active{color:var(--red);border-bottom-color:var(--red);}
  .hist-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .app-footer{margin-top:40px;text-align:center;font-size:11px;color:var(--grey3);}
  .spec-sheet .ss-link{color:#821E20;text-decoration:underline;cursor:pointer;}
  .spec-sheet .ss-link::after{content:" \2197";font-size:11px;}
  .stale-flag{font-size:10px;font-weight:700;color:#946200;background:#fbe9c6;padding:2px 6px;border-radius:4px;vertical-align:middle;}
  .groups-dropdown{position:absolute;top:100%;right:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:60;min-width:190px;display:flex;flex-direction:column;gap:2px;margin-top:4px;}
  .catalog-actions{display:flex;gap:6px;margin-top:auto;flex-wrap:wrap;}
  .empty{color:var(--grey2);text-align:center;padding:40px 10px;font-size:14px;}
  .section-bar{background:var(--ink);color:#fff;font-weight:800;font-size:13px;letter-spacing:.03em;padding:8px 14px;border-radius:6px 6px 0 0;margin-top:26px;}
  .section-body{border:1px solid var(--line);border-top:none;border-radius:0 0 6px 6px;padding:16px;}
  .chk-group{display:flex;gap:16px;flex-wrap:wrap;}
  .chk-opt{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 2px;border-radius:4px;}
  .chk-opt .box{font-size:15px;}
  .chk-opt.sel{font-weight:700;color:var(--ink);}
  .chk-opt:not(.sel){color:var(--grey2);}
  .imgs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:10px;}
  .img-box{border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .img-box img{width:100%;height:120px;object-fit:cover;display:block;background:var(--panel);}
  .img-box .cap{padding:6px;}
  .img-box .cap input{font-size:12px;padding:5px 6px;}
  .img-remove{display:block;width:100%;text-align:center;font-size:11px;padding:5px;color:var(--red);background:none;border:none;border-top:1px solid var(--line);cursor:pointer;}
  .img-box{position:relative;cursor:grab;}
  .img-box.dragging{opacity:.4;}
  .img-box.drag-over{outline:2px dashed var(--red);outline-offset:-2px;}
  .img-move{display:block;width:100%;text-align:center;font-size:11px;padding:5px;color:var(--ink);background:none;border:none;border-top:1px solid var(--line);border-right:1px solid var(--line);cursor:pointer;}
  .img-move[disabled]{opacity:.3;cursor:default;}
  .note{font-size:12px;color:var(--grey3);font-style:italic;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.2);max-width:90vw;text-align:center;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);display:flex;align-items:center;justify-content:center;z-index:200;padding:30px;}
  .lightbox-overlay img{max-width:92vw;max-height:88vh;object-fit:contain;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .lightbox-close{position:fixed;top:18px;right:22px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;z-index:201;}
  .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .confirm-box{background:var(--bg);border-radius:12px;padding:22px 22px 18px;max-width:340px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);}
  .confirm-box p{margin:0 0 16px;font-size:14px;}
  .confirm-box .row{display:flex;gap:8px;justify-content:flex-end;}
  .setup-warning{background:#fdecea;border:1px solid #f2b8b5;color:#821E20;padding:14px 16px;border-radius:8px;font-size:13.5px;margin-bottom:18px;}
  .import-drop{border:2px dashed var(--line);border-radius:10px;padding:34px 16px;text-align:center;color:var(--grey2);cursor:pointer;}
  .import-drop:hover{border-color:var(--red);color:var(--red);}
  .banner{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}

  #printArea{display:none;}
  .spec-sheet{max-width:760px;margin:0 auto;background:#fff;color:#1A1A1A;font-size:13px;}
  .spec-sheet .title{font-weight:800;font-size:22px;line-height:1.15;margin-bottom:6px;}
  .spec-sheet .subtitle{font-weight:800;font-size:16px;color:#821E20;margin-bottom:14px;}
  .ss-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
  .ss-table td,.ss-table th{border:1px solid #BFBFBF;padding:8px 10px;vertical-align:middle;font-size:13px;}
  .ss-table td.lbl{background:#F2F2F2;font-weight:700;font-size:12px;width:150px;}
  .ss-bar{background:#1A1A1A;color:#fff;font-weight:800;font-size:14px;letter-spacing:.02em;padding:7px 12px;}
  .ss-weightband td{text-align:center;padding:12px 8px;}
  .ss-weightband .k{font-weight:700;font-size:11px;color:#606060;display:block;}
  .ss-weightband .v{font-weight:800;font-size:22px;display:block;margin:4px 0;}
  .ss-weightband .d{font-style:italic;font-size:11px;color:#808080;}
  .ss-weightband .mincell .v{color:#1A1A1A;}
  .ss-weightband .targetcell{background:#ECDDDE;}
  .ss-weightband .targetcell .v{color:#821E20;}
  .ss-check{color:#808080;margin-right:14px;font-size:13px;}
  .ss-check.on{color:#1A1A1A;font-weight:700;}
  .ss-imgs{display:grid;grid-template-columns:1fr;gap:18px;margin-top:8px;}
  .ss-imgs .im{border:1px solid #BFBFBF;border-radius:4px;overflow:hidden;text-align:center;break-inside:avoid;page-break-inside:avoid;}
  .ss-imgs img{width:100%;max-height:850px;object-fit:contain;background:#f5f5f5;}
  .ss-imgs.size-small img{max-height:220px;}
  .ss-imgs.size-medium img{max-height:450px;}
  .ss-imgs.size-large img{max-height:850px;}
  .ss-imgs .cap{font-size:12px;padding:6px;color:#404040;}
  .ss-footer{margin-top:20px;font-size:11px;color:#606060;border-top:1px solid #BFBFBF;padding-top:8px;}
  .ss-edit-note{font-size:11px;color:#909090;font-style:italic;margin-top:2px;}
  .ss-custom{white-space:pre-wrap;font-size:13px;border:1px solid #BFBFBF;border-radius:4px;padding:10px 12px;background:#fff;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block;position:absolute;top:0;left:0;width:100%;}
    @page{margin:14mm;}
    .spec-sheet .ss-link{color:inherit;text-decoration:none;}
    .spec-sheet .ss-link::after{content:"";}
  }
</style>
</head>

<div id="printArea"></div>
<div id="toastHost"></div>

  // ---------- data ----------
  // Groups: each channel has its own list. Saved as a plain list until Retail gets groups of its own
  // (a plain list = the Meat Me At Home groups, exactly as before), then as {mmah:[...], retail:[...]}.
  function normGroupList(a){
    return (Array.isArray(a) ? a : []).filter(function(g){ return g && g.key && g.label; }).map(function(g){ return {key:String(g.key), label:String(g.label)}; });
  }
  function parseGroupLists(raw){
    if(Array.isArray(raw)) return {mmah: normGroupList(raw), retail: []};
    if(raw && typeof raw === "object") return {mmah: normGroupList(raw.mmah), retail: normGroupList(raw.retail)};
    return null;

    var seen = {}, out = [];

  async function loadGroupOptions(){

  async function loadSpecs(){

  // Downloads every spec (both channels, archived included) as one JSON file \u2014 a safety copy independent
  // of Supabase. Fetches fresh rather than using whatever's already in memory, so the backup is never stale.
  window.exportBackup = async function(){
    if(!SETUP_OK){ showToast("Add your Supabase URL/key at the top of the file first."); return; }
    showToast("Preparing backup\u2026");
    try{
      var res = await sb.from("specs").select("id, spec, updated_at").order("updated_at", {ascending:false});
      if(res.error) throw res.error;
      var specs = (res.data||[]).map(function(row){
        var d = Object.assign({}, row.spec || {});
        d.id = row.id; d.updatedAt = row.updated_at;
        return d;
      });
      var payload = {exportedAt: new Date().toISOString(), appVersion: APP_VERSION, specCount: specs.length, specs: specs};
      var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "spec-portal-backup-" + todayISO() + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      showToast("Backup downloaded (" + specs.length + " specs).");
    }catch(e){
      showToast("Backup failed: " + (e.message||e));
    }
  };

  // ---------- helpers ----------
  function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  function fmtDate(iso){
    if(!iso) return "\u2014";
    try{ var d=new Date(iso); return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}); }catch(e){ return iso; }
  }

  // ---------- navigation ----------
  window.toggleGroupsDropdown = function(){ S.groupsDropdownOpen = !S.groupsDropdownOpen; render(); };
  function goManageGroups(){
    var ch = (S.channel === "mmah" || S.channel === "retail") ? S.channel : (S.lastChannel === "retail" ? "retail" : "mmah");
    S.groupsDraft = {
      mmah:   groupsFor("mmah").map(function(g){ return {key:g.key, label:g.label}; }),

  function draftList(){ return S.groupsDraft[S.groupsDraftChannel === "retail" ? "retail" : "mmah"]; }
  function slugifyGroup(label){
    return label.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,24) || ("g"+Date.now());
  }
  window.setGroupsDraftChannel = function(ch){ S.groupsDraftChannel = ch === "retail" ? "retail" : "mmah"; S.newGroupLabel = ""; render(); };
  window.addDraftGroup = function(){
    var label = (S.newGroupLabel||"").trim();
    if(!label) return;
    var list = draftList();
    var existingKeys = S.groupsDraft.mmah.concat(S.groupsDraft.retail).map(function(g){return g.key;});
    var prefix = S.groupsDraftChannel === "retail" ? "r_" : "";              // Retail keys can never clash with MMAH ones
    var key = prefix + slugifyGroup(label), i=1;
    while(existingKeys.indexOf(key)>=0){ key = prefix + slugifyGroup(label)+i; i++; }
    list.push({key:key, label:label});
    S.newGroupLabel = "";
    render();
  };
  window.removeDraftGroup = function(idx){ draftList().splice(idx,1); render(); };
  window.renameDraftGroup = function(idx, val){ draftList()[idx].label = val; };
  window.moveDraftGroup = function(idx, dir){
    var list = draftList(), newIdx = idx+dir;
    if(newIdx<0 || newIdx>=list.length) return;
    var tmp = list[idx]; list[idx]=list[newIdx]; list[newIdx]=tmp;
    render();

  window.saveGroups = async function(){

  // --- unsaved-changes tracking ---
  function resetFormMeta(){ S.formErrors = {}; S.groupsDropdownOpen = false; S.importBanner = ""; }

  async function checkEditLock(id){
    if(!SETUP_OK) return;
    try{
      var res = await sb.from("edit_locks").select("*").eq("spec_id", id);
      if(res.error) throw res.error;
      var rows = res.data||[];
      if(rows.length){
        var lock = rows[0];
        var age = Date.now() - new Date(lock.locked_at).getTime();
        if(age < 10*60*1000 && lock.editor_name && lock.editor_name !== (S.editorName||"")){
          showToast("\u26a0 " + lock.editor_name + " may currently be editing this \u2014 check with them before saving.");
        }
      }
      await sb.rpc("claim_edit_lock", {p_spec_id:id, p_editor_name:(S.editorName||"Someone")});
    }catch(e){ console.error("Edit lock check failed:", e); }
  }
  async function releaseEditLock(id){

    catch(e){ console.error("Release lock failed:", e); }
  }

  function loadSpecIntoForm(spec){
    var ch = specChannel(spec);
    var f = Object.assign(blankSpec(ch), JSON.parse(JSON.stringify(spec)));
    f.channel = ch;
    f.furtherOutputs = normFurther(f.furtherOutputs);
    delete f.channels;
    if(ch === "mmah"){ delete f.avgWeightMin; delete f.avgWeightNote; }      // not part of the MMAH template
    if(ch === "retail"){ delete f.writtenBy; }                                 // Retail now uses Amended by only
    f.issuedDate = todayISO();                                               // re-issued today
    return f;
  }
  function goEdit(id){
    var spec = S.specs.filter(function(s){return s.id===id;})[0];

    S.form = loadSpecIntoForm(spec);

    render(); window.scrollTo(0,0);
    checkEditLock(id);

  function duplicateSpec(id){
    var spec = S.specs.filter(function(s){return s.id===id;})[0];
    if(!spec){ showToast("Couldn't find that spec \u2014 try again from the Library."); return; }
    var clone = loadSpecIntoForm(spec);
    delete clone.id; delete clone.updatedAt;
    clone.productName = (clone.productName||"") + " (Copy)";
    clone.editHistory = [];
    clone.archived = false;
    S.form = clone; S.formId = null; S.view = "form";
    resetFormMeta(); markUnsaved();
    S.importBanner = "Duplicated from an existing spec \u2014 review before saving.";
    render(); window.scrollTo(0,0);

  async function archiveSpec(id, archivedFlag){
    var spec = S.specs.filter(function(s){return s.id===id;})[0];
    if(!spec){ showToast("Couldn't find that spec \u2014 try again from the Library."); return; }
    var name = (S.editorName||"").trim();
    if(!name){ showToast("Your name is required \u2014 enter it above first."); return; }
    var pwd = getPassword();
    if(!pwd) return;
    localStorage.setItem("mmah_editor_name", name);
    var payload = JSON.parse(JSON.stringify(spec));
    delete payload.id;
    payload.archived = archivedFlag;
    payload.editHistory = (payload.editHistory||[]).concat([{by:name, at:new Date().toISOString(), action: archivedFlag?"archived":"unarchived"}]);
    try{
      var res = await sb.rpc("update_spec", {pwd:pwd, spec_id:id, payload:payload});
      if(res.error) throw res.error;
      showToast(archivedFlag ? "Archived." : "Restored.");
      releaseEditLock(id);
      S.view="library"; S.formId=null; S.form=null;
      loadSpecs();
    }catch(e){ handleWriteError(e); }
  }

    openPrintSpec(spec);

  function onAppClick(e){

    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");
    try{
      if(action==="print") goPrint(id);
      else if(action==="edit") goEdit(id);
      else if(action==="duplicate") tryLeave(function(){ duplicateSpec(id); });
      else if(action==="archive") tryLeave(function(){ archiveSpec(id, true); });
      else if(action==="unarchive") tryLeave(function(){ archiveSpec(id, false); });
      else if(action==="openChannel") goChannel(el.getAttribute("data-channel"));
      else if(action==="importChannel"){ S.importChannel = el.getAttribute("data-channel") === "retail" ? "retail" : "mmah"; render(); }
      else if(action==="printTab"){ S.printTab = el.getAttribute("data-tab") || "sheet"; render(); window.scrollTo(0,0); }
      else if(action==="viewVersion"){
        var vidx = parseInt(el.getAttribute("data-idx"),10);
        var entry = (S.printSpec.editHistory||[])[vidx];
        if(entry && entry.snapshot){
          var snap = JSON.parse(JSON.stringify(entry.snapshot));
          snap.productName = snap.productName || S.printSpec.productName;
          snap.channel = specChannel(snap.channel ? snap : S.printSpec);
          S.versionSnapshot = snap;
          S.versionMeta = {by:entry.by, at:entry.at, action:entry.action};
          S.view = "version";
          render(); window.scrollTo(0,0);
        }
      }
      else if(action==="delete"){ S.confirmDelete = id; render(); }
      else if(action==="reallyDelete") performDelete(id);
      else if(action==="cancelDelete"){ S.confirmDelete = null; render(); }
      else if(action==="removeImg") removeImg(parseInt(el.getAttribute("data-idx"),10));
      else if(action==="rotateImg") rotateImg(parseInt(el.getAttribute("data-idx"),10));
      else if(action==="moveImg") moveImg(parseInt(el.getAttribute("data-idx"),10), parseInt(el.getAttribute("data-dir"),10));
      else if(action==="lightbox") openLightbox(el.getAttribute("data-url"), parseInt(el.getAttribute("data-rot")||"0",10));
      else if(action==="closeLightbox") closeLightbox();
    }catch(err){
      console.error("Portal action error:", err);
      showToast("Something went wrong: " + (err && err.message ? err.message : String(err)));
    }
  }

    if(previewCaps[idx]) previewCaps[idx].textContent = val;
  };
  window.removeImg = function(idx){ S.form.referenceImages.splice(idx,1); render(); };
  window.moveImg = function(idx, dir){
    var list = S.form.referenceImages, newIdx = idx+dir;
    if(newIdx<0 || newIdx>=list.length) return;
    var tmp = list[idx]; list[idx]=list[newIdx]; list[newIdx]=tmp;
    render();

  function wireImageDragDrop(){
    var grid = document.querySelector(".imgs-grid");
    if(!grid) return;
    var dragIdx = null;
    grid.querySelectorAll(".img-box").forEach(function(box){
      box.ondragstart = function(e){
        dragIdx = parseInt(box.getAttribute("data-img-idx"),10);
        box.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      };
      box.ondragend = function(){
        box.classList.remove("dragging");
        grid.querySelectorAll(".img-box").forEach(function(b){ b.classList.remove("drag-over"); });
      };
      box.ondragover = function(e){ e.preventDefault(); box.classList.add("drag-over"); };
      box.ondragleave = function(){ box.classList.remove("drag-over"); };
      box.ondrop = function(e){
        e.preventDefault();
        box.classList.remove("drag-over");
        var dropIdx = parseInt(box.getAttribute("data-img-idx"),10);
        if(dragIdx===null || dropIdx===dragIdx) return;
        var list = S.form.referenceImages;
        var moved = list.splice(dragIdx,1)[0];
        list.splice(dropIdx,0,moved);
        render();
      };
    });
  }
  window.rotateImg = function(idx){
    var img = S.form.referenceImages[idx];
    img.rotation = ((img.rotation||0) + 90) % 360;
    render();
  };

  async function handleImageUpload(files){
    if(!SETUP_OK){ showToast("Add your Supabase URL/key at the top of the file first."); return; }
    for(var i=0;i<files.length;i++){
      var file = files[i];
      var path = Date.now()+"_"+Math.random().toString(36).slice(2)+"_"+file.name.replace(/[^a-zA-Z0-9.\-_]/g,"_");
      try{
        var up = await sb.storage.from("spec-images").upload(path, file, {upsert:false});
        if(up.error) throw up.error;
        var pub = sb.storage.from("spec-images").getPublicUrl(path);
        S.form.referenceImages.push({id:path, url:pub.data.publicUrl, caption:"", rotation:0});
        render();
      }catch(e){ showToast("Image upload failed: " + (e.message||"error")); }
    }
  }

  function readFormFromInputs(){
    var el = document.getElementById("specForm");

    TEMPLATE[specChannel(S.form)].textFields.forEach(function(name){

  // ---------- required-field validation ----------
  function validateForm(){
    readFormFromInputs();
    var errs = {}, order = [];
    if(!(S.form.productName||"").trim()){ errs.productName = true; order.push("productName"); }
    if(specChannel(S.form) === "retail" && !S.form.trimDiscard && !(S.form.trimSku||"").trim()){ errs.trimSku = true; order.push("trimSku"); }
    if(!(S.editorName||"").trim()){ errs.editorName = true; order.push("editorName"); }
    TEMPLATE[specChannel(S.form)].requiredTicks.forEach(function(t){ if(!S.form[t[0]]){ errs[t[0]] = true; order.push(t[0]); } });
    S.formErrors = errs;
    return order;                                   // in on-screen order, so [0] is the first one to jump to
  }
  function scrollToField(key){
    var el = document.getElementById("fld-"+key);
    if(!el) return;
    el.scrollIntoView({behavior:"smooth", block:"center"});

    if(inp){ try{ inp.focus({preventScroll:true}); }catch(e){ inp.focus(); } }

  function clearFieldError(key){
    if(S.formErrors && S.formErrors[key]){

  function stripSpaces(v){ return (v||"").replace(/\s+/g,""); }

  async function saveSpec(){
    var missing = validateForm();
    if(missing.length){
      render();
      scrollToField(missing[0]);
      showToast("Please complete the highlighted required field" + (missing.length>1 ? "s" : "") + ".");
      return;
    }
    var name = (S.editorName||"").trim();
    S.form.outputSku = stripSpaces(S.form.outputSku);
    S.form.inputSku = stripSpaces(S.form.inputSku);
    if(S.form.outputSku2) S.form.outputSku2 = stripSpaces(S.form.outputSku2);
    S.form.channel = specChannel(S.form);
    if(S.form.channel === "retail"){
      if(S.form.trimDiscard){ S.form.trimSku = ""; S.form.trimText = ""; }        // discarded: nothing to keep on the sheet
      else S.form.trimSku = stripSpaces(S.form.trimSku);
    }
    S.form.furtherOutputs = normFurther(S.form.furtherOutputs).filter(function(o){ return (o.label||"").trim() || o.specId; });
    if(!SETUP_OK){ showToast("Add your Supabase URL/key at the top of the file first."); return; }
    var pwd = getPassword();
    if(!pwd) return;
    localStorage.setItem("mmah_editor_name", name);
    var payload = JSON.parse(JSON.stringify(S.form));
    payload.issuedByInitials = name;
    delete payload.id;
    if(S.formId){
      var priorSpec = S.specs.filter(function(s){return s.id===S.formId;})[0];
      var snapshot = null;
      if(priorSpec){
        snapshot = JSON.parse(JSON.stringify(priorSpec));
        delete snapshot.id; delete snapshot.updatedAt; delete snapshot.editHistory;
      }
      payload.editHistory = (payload.editHistory||[]).concat([{by:name, at:new Date().toISOString(), snapshot:snapshot}]);
      try{
        var res = await sb.rpc("update_spec", {pwd:pwd, spec_id:S.formId, payload:payload});
        if(res.error) throw res.error;
        showToast("Spec updated.");
        releaseEditLock(S.formId);
        var updated = JSON.parse(JSON.stringify(payload)); updated.id = S.formId; updated.updatedAt = new Date().toISOString();
        openPrintSpec(updated);
        loadSpecs();
      }catch(e){ handleWriteError(e); }
    } else {
      payload.editHistory = [];
      try{
        var res2 = await sb.rpc("create_spec", {pwd:pwd, payload:payload});
        if(res2.error) throw res2.error;
        showToast("Spec created.");
        var created = JSON.parse(JSON.stringify(payload)); created.id = res2.data; created.updatedAt = new Date().toISOString();
        openPrintSpec(created);
        loadSpecs();
      }catch(e){ handleWriteError(e); }
    }
  }

  async function performDelete(id){
    if(!SETUP_OK) return;
    var pwd = getPassword();
    if(!pwd) return;
    try{
      var res = await sb.rpc("delete_spec", {pwd:pwd, spec_id:id});
      if(res.error) throw res.error;
      releaseEditLock(id);
      S.confirmDelete = null; showToast("Deleted."); goLibrary();
    }catch(e){ S.confirmDelete=null; render(); handleWriteError(e); }
  }

  function autoDetectGroups(spec){
    var tags = [];
    var sku = ((spec.outputSku||"") + " " + (spec.inputSku||"")).toLowerCase();
    var title = (spec.productName||"").toLowerCase();
    if(sku.indexOf("mmah")>=0) tags.push("mmah");
    if(title.indexOf("british")>=0) tags.push("brit");
    if(title.indexOf("japan")>=0) tags.push("jap");
    if(title.indexOf("chilean")>=0) tags.push("chilean");
    return tags;
  }
  function channelShort(key){ var c = CHANNELS.filter(function(x){return x.key===key;})[0]; return c ? c.short : key; }
  function channelBadgesHtml(spec){
    var ch = specChannel(spec);
    return '<span class="chan-badge '+ch+'">'+esc(channelShort(ch))+'</span>';
  }
  // manual tags + automatic ones. MMAH: by SKU / name as before. Retail: any group whose name appears in the product name.
  function effectiveGroups(spec){
    var ch = specChannel(spec), list = groupsFor(ch), keys = list.map(function(g){ return g.key; });
    var merged = (spec.groups||[]).slice();
    function add(k){ if(merged.indexOf(k)<0) merged.push(k); }
    if(ch === "mmah") autoDetectGroups(spec).forEach(function(k){ if(keys.indexOf(k)>=0) add(k); });
    if(ch === "retail"){
      var title = (spec.productName||"").toLowerCase();
      list.forEach(function(g){ var lab = g.label.toLowerCase().trim(); if(lab.length >= 4 && title.indexOf(lab) >= 0) add(g.key); });
    }
    return merged;
  }
  function isStale(s){
    var dateStr = s.issuedDate || s.updatedAt;
    if(!dateStr) return false;
    var t = new Date(dateStr).getTime();
    if(isNaN(t)) return false;
    return (Date.now() - t) > 365*24*60*60*1000;
  }

  function channelStats(key){
    var list = S.specs.filter(function(x){ return !x.archived && specChannel(x) === key; });
    var labels = [];
    groupsFor(key).forEach(function(g){
      if(g.key==="mmah") return;                    // the channel itself already says this
      if(list.some(function(x){ return effectiveGroups(x).indexOf(g.key)>=0; })) labels.push(g.label);
    });
    return {count:list.length, groups:labels};
  }

  function renderLibrary(){
    var q = S.search.trim().toLowerCase();
    var showArchived = S.libraryFilter === "archived";
    var groupFilter = (S.libraryFilter && S.libraryFilter !== "archived") ? S.libraryFilter : null;
    var list = S.specs.filter(function(s){
      if(!!s.archived !== showArchived) return false;
      if(S.channel && S.channel !== "all" && specChannel(s) !== S.channel) return false;
      if(groupFilter && effectiveGroups(s).indexOf(groupFilter)<0) return false;
      if(!q) return true;
      return (s.productName||"").toLowerCase().indexOf(q)>=0 || (s.outputSku||"").toLowerCase().indexOf(q)>=0
        || (s.inputSku||"").toLowerCase().indexOf(q)>=0 || (s.outputSageDesc||"").toLowerCase().indexOf(q)>=0;

    var out = '<div class="tabs">' + CHANNELS.map(function(c){

      + '<button class="tab'+(S.channel==="all"?' active':'')+'" data-action="openChannel" data-channel="all">All specs</button></div>';
    out += '<div class="field search-bar"><input type="text" id="librarySearchInput" placeholder="Search by product name, Sage description, or SKU\u2026" value="'+esc(S.search)+'" oninput="S.search=this.value; render();">'

      + '</div>'
      + '<div style="margin-bottom:14px"><button class="btn-ghost btn-sm" onclick="goManageGroups()">\u2699 Manage groups</button>'

    if(S.loadingSpecs) out += '<div class="empty"><span class="spinner"></span> Loading specs\u2026</div>';
    else if(!list.length) out += '<div class="empty">'+(showArchived ? 'No archived specs.' : 'No specs here yet. Click <b>+ New Spec</b> to add one.')+'</div>';

  // ---------- Word (.docx) import: text + photos ----------
  var NS_W  = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  var NS_WP = "http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing";
  var NS_A  = "http://schemas.openxmlformats.org/drawingml/2006/main";
  var NS_R  = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  var NS_MC = "http://schemas.openxmlformats.org/markup-compatibility/2006";

  function isDocx(file){
    return /\.docx$/i.test(file.name || "") || file.type === "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
  }
  function xmlKids(el, name){
    return Array.prototype.filter.call(el.childNodes, function(n){ return n.nodeType===1 && n.localName===name; });
  }
  function docxParaText(p){
    var out = "";
    Array.prototype.forEach.call(p.getElementsByTagNameNS(NS_W, "*"), function(n){
      if(n.localName === "t") out += n.textContent;
      else if(n.localName === "tab") out += "\t";
      else if(n.localName === "br" || n.localName === "cr") out += "\n";
    });
    return out.replace(/[ \t]+\n/g, "\n").trim();
  }
  // paragraphs become lines; table rows become "cell | cell | cell" so labels stay next to their values
  function docxBlocks(container, out){
    Array.prototype.forEach.call(container.childNodes, function(n){
      if(n.nodeType !== 1) return;
      if(n.localName === "p"){ var t = docxParaText(n); if(t) out.push(t); }
      else if(n.localName === "tbl"){
        xmlKids(n, "tr").forEach(function(tr){
          var cells = xmlKids(tr, "tc").map(function(tc){ var l = []; docxBlocks(tc, l); return l.join(" / "); });
          var row = cells.join(" | ").trim();
          if(row.replace(/[|\s\/]/g, "")) out.push(row);
        });
      }
      else if(n.localName === "sdt"){ xmlKids(n, "sdtContent").forEach(function(c){ docxBlocks(c, out); }); }
    });
  }
  // width/height/type from the file header, so we can skip logos/icons without decoding anything
  function imageInfo(u8){
    if(!u8 || u8.length < 12) return null;
    if(u8[0]===0x89 && u8[1]===0x50 && u8[2]===0x4E && u8[3]===0x47){
      return {ext:"png", type:"image/png",
        w:((u8[16]<<24)|(u8[17]<<16)|(u8[18]<<8)|u8[19])>>>0, h:((u8[20]<<24)|(u8[21]<<16)|(u8[22]<<8)|u8[23])>>>0};
    }
    if(u8[0]===0xFF && u8[1]===0xD8){
      var i = 2;
      while(i + 9 < u8.length){
        if(u8[i] !== 0xFF){ i++; continue; }
        var m = u8[i+1];
        if(m===0xD8 || m===0x01 || (m>=0xD0 && m<=0xD7)){ i += 2; continue; }
        var len = (u8[i+2]<<8) | u8[i+3];
        if(m>=0xC0 && m<=0xCF && m!==0xC4 && m!==0xC8 && m!==0xCC){
          return {ext:"jpg", type:"image/jpeg", h:(u8[i+5]<<8)|u8[i+6], w:(u8[i+7]<<8)|u8[i+8]};
        }
        i += 2 + len;
      }
      return {ext:"jpg", type:"image/jpeg", w:0, h:0};
    }
    if(u8[0]===0x47 && u8[1]===0x49 && u8[2]===0x46) return {ext:"gif", type:"image/gif", w:u8[6]|(u8[7]<<8), h:u8[8]|(u8[9]<<8)};
    if(u8[0]===0x52 && u8[1]===0x49 && u8[2]===0x46 && u8[3]===0x46 && u8[8]===0x57 && u8[9]===0x45) return {ext:"webp", type:"image/webp", w:0, h:0};
    return null;     // EMF/WMF/TIFF etc. \u2014 browsers can't show these
  }
  function docxTargetPath(target){
    if(target.charAt(0) === "/") return target.slice(1);      // some files use package-root paths like "/media/image2.jpg"
    var out = [];
    ("word/" + target).split("/").forEach(function(p){ if(p === ".."){ out.pop(); } else if(p !== "." && p !== ""){ out.push(p); } });
    return out.join("/");
  }
  // Word's alt text is only useful as a caption when a person actually wrote it
  function docxCaption(d){
    d = (d || "").replace(/\s+/g, " ").trim();
    if(!d || /automatically generated/i.test(d)) return "";
    if(/\.(jpe?g|png|gif|webp|bmp)$/i.test(d)) return "";
    if(/^(picture|image|graphic|drawing|photo)\s*\d*$/i.test(d)) return "";
    return d.slice(0, 140);
  }
  // the caption line just above a picture ("Finished presentation \u2014 ..."), as used on the spec templates
  function docxLeadCaption(dr){
    var p = dr; while(p && p.localName !== "p") p = p.parentNode;
    if(!p) return "";
    var prev = p.previousSibling, guard = 0;
    while(prev && guard++ < 12){
      if(prev.nodeType === 1 && prev.localName === "p"){
        var t = docxParaText(prev).replace(/\s+/g, " ").trim();
        if(t) return /^finished presentation/i.test(t) ? t.slice(0, 140) : "";
      }
      prev = prev.previousSibling;
    }
    return "";
  }
  async function readDocx(file){
    if(typeof JSZip === "undefined") throw new Error("Word import didn't load \u2014 check your connection and refresh the page.");
    var zip = await JSZip.loadAsync(await file.arrayBuffer());
    var docFile = zip.file("word/document.xml");
    if(!docFile) throw new Error("That doesn't look like a Word (.docx) file.");
    var parser = new DOMParser();
    var doc = parser.parseFromString(await docFile.async("string"), "application/xml");
    Array.prototype.slice.call(doc.getElementsByTagNameNS(NS_MC, "Fallback")).forEach(function(n){ n.parentNode.removeChild(n); });   // avoids text-box text appearing twice

    var lines = [];
    var body = doc.getElementsByTagNameNS(NS_W, "body")[0];
    if(body) docxBlocks(body, lines);

    var relMap = {};
    var relsFile = zip.file("word/_rels/document.xml.rels");
    if(relsFile){
      var rdoc = parser.parseFromString(await relsFile.async("string"), "application/xml");
      Array.prototype.forEach.call(rdoc.getElementsByTagName("Relationship"), function(r){ relMap[r.getAttribute("Id")] = r.getAttribute("Target"); });
    }
    // Only pictures placed in the body of the document (in order). Letterhead/logo artwork lives in the page
    // header/background, so it is left out automatically; the same picture used twice is taken once.
    var images = [], seen = {};
    var drawings = doc.getElementsByTagNameNS(NS_W, "drawing");
    for(var i = 0; i < drawings.length && images.length < 8; i++){
      var dr = drawings[i];
      var anchor = dr.getElementsByTagNameNS(NS_WP, "anchor")[0];
      if(anchor && anchor.getAttribute("behindDoc") === "1") continue;
      var blip = dr.getElementsByTagNameNS(NS_A, "blip")[0];
      var rid = blip && blip.getAttributeNS(NS_R, "embed");
      var target = rid && relMap[rid];
      if(!target || seen[target]) continue;
      seen[target] = true;
      var path = docxTargetPath(target);
      var entry = zip.file(path);
      if(!entry){
        var base = path.split("/").pop().replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        entry = zip.file(new RegExp("(^|/)" + base + "$", "i"))[0];
      }
      if(!entry) continue;
      var bytes = await entry.async("uint8array");
      var info = imageInfo(bytes);
      if(!info) continue;
      if(info.w && info.h && (info.w < 100 || info.h < 100)) continue;       // tiny icons
      var docPr = dr.getElementsByTagNameNS(NS_WP, "docPr")[0];
      images.push({bytes:bytes, info:info, caption:docxLeadCaption(dr) || docxCaption(docPr && docPr.getAttribute("descr"))});
    }
    return {text: lines.join("\n"), images: images};
  }
  // phone/DSLR photos can be 10MB+: scale big JPEGs down (still far bigger than the sheet needs) before storing
  async function shrinkIfHuge(blob){
    if(blob.type !== "image/jpeg" || blob.size < 1500000 || typeof createImageBitmap !== "function") return blob;
    try{
      var bmp = await createImageBitmap(blob);
      var scale = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
      var c = document.createElement("canvas");
      c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      var out = await new Promise(function(res){ c.toBlob(res, "image/jpeg", 0.9); });
      return (out && out.size < blob.size) ? out : blob;
    }catch(e){ return blob; }
  }
  async function uploadDocxImages(list){
    var done = [];
    for(var i = 0; i < list.length; i++){
      try{
        var blob = await shrinkIfHuge(new Blob([list[i].bytes], {type:list[i].info.type}));
        var ext = blob.type === "image/jpeg" ? "jpg" : list[i].info.ext;
        var path = Date.now() + "_" + Math.random().toString(36).slice(2) + "." + ext;
        var up = await withTimeout(sb.storage.from("spec-images").upload(path, blob, {upsert:false, contentType:blob.type || list[i].info.type}), 60000);
        if(up && up.error) throw up.error;
        var pub = sb.storage.from("spec-images").getPublicUrl(path);
        done.push({id:path, url:pub.data.publicUrl, caption:list[i].caption || "", rotation:0});
      }catch(e){ console.error("Photo upload failed:", e); }
    }
    return done;
  }

  async function handleImportFile(file){
    if(!SETUP_OK){ showToast("Add your Supabase URL/key at the top of the file first."); return; }
    var pwd = getPassword();
    if(!pwd) return;
    S.importBusy = true; render();
    console.log("Import: starting, file type", file.type);
    try{
      var mode, content, mediaType, uploadP = null;
      var ich = S.importChannel === "retail" ? "retail" : "mmah";
      if(file.type === "application/pdf"){
        var buf = await file.arrayBuffer();
        var pdf = await withTimeout(pdfjsLib.getDocument({data:buf}).promise, 20000);
        var extracted = "";
        for(var p=1;p<=pdf.numPages;p++){
          var page = await pdf.getPage(p);
          var tc = await page.getTextContent();
          extracted += tc.items.map(function(it){return it.str;}).join(" ") + "\n";
        }
        console.log("Import: text extracted (" + extracted.length + " chars)");
        mode="text"; content=extracted; mediaType=null;
      } else if(isDocx(file)){
        var dx = await withTimeout(readDocx(file), 40000);
        console.log("Import: Word text extracted (" + dx.text.length + " chars), photos found:", dx.images.length);
        mode="text"; content=dx.text; mediaType=null;
        if(dx.images.length){
          showToast("Uploading " + dx.images.length + " photo" + (dx.images.length===1?"":"s") + " from the Word file\u2026");
          uploadP = uploadDocxImages(dx.images);      // runs alongside the AI reading; never rejects
        }
      } else if(/\.doc$/i.test(file.name || "")){
        showToast("Old .doc files can't be read \u2014 open it in Word, choose Save As \u2192 Word Document (.docx), and upload that.");
        S.importBusy=false; render(); return;
      } else if(file.type.indexOf("image/")===0){
        mode="image"; content=await fileToBase64(file); mediaType=file.type;
      } else {
        showToast("Please upload a Word (.docx), PDF or image file.");
        S.importBusy=false; render(); return;
      }

      console.log("Import: calling AI\u2026");
      var res = await withTimeout(fetch(EDGE_FUNCTION_URL, {
        method:"POST",
        headers:{"Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY},
        body: JSON.stringify({pwd:pwd, mode:mode, content:content, mediaType:mediaType, schemaHint:TEMPLATE[ich].hint})
      }), 45000);
      console.log("Import: AI responded, status", res.status);
      var data = await res.json();
      var photos = uploadP ? await uploadP : [];
      if(!res.ok || data.error){
        console.error("Import: AI call failed \u2014 full response:", data);
        if(String(data.error||"").toLowerCase().indexOf("password")>=0) sessionStorage.removeItem("mmah_pwd");
        showToast("Import failed: " + (data.error || res.status) + ". You can still fill the form manually.");
        S.form = blankSpec(ich); S.formId=null; S.view="form"; markPristine();
        S.importBanner = "Automatic import didn't work \u2014 fill in the details manually below.";
        if(photos.length){ S.form.referenceImages = photos; markUnsaved(); S.importBanner += " The photos from the file were kept."; }
      } else {
        applyImportedData(data, photos, ich);
      }
    }catch(e){
      showToast("Import failed: " + (e.message||e) + ". You can still fill the form manually.");
      var keptPhotos = [];
      if(uploadP){ try{ keptPhotos = await uploadP; }catch(e2){} }
      S.form = blankSpec(ich); S.formId=null; S.view="form"; markPristine();
      S.importBanner = "Automatic import didn't work \u2014 fill in the details manually below.";
      if(keptPhotos.length){ S.form.referenceImages = keptPhotos; markUnsaved(); S.importBanner += " The photos from the file were kept."; }
    }
    S.importBusy = false;
    render();
  }

  function applyImportedData(data, photos, ch){
    ch = ch === "retail" ? "retail" : "mmah";
    var T = TEMPLATE[ch];
    var f = blankSpec(ch);
    T.importFields.forEach(function(k){
      if(data && data[k] !== undefined && data[k] !== null && data[k] !== "" && typeof data[k] !== "object"){
        if(T.tickOpts[k] && !T.tickOpts[k].some(function(o){ return o[0] === data[k]; })) return;   // ignore values that aren't a real option
        f[k] = data[k];
      }
    });
    ["minWeight","maxWeight","targetWeight","avgWeightMin"].forEach(function(k){
      if(f[k]) f[k] = String(f[k]).replace(/\s*g$/i, "").trim();                                 // "232 g" -> "232"
    });
    if(ch === "retail"){
      f.trimDiscard = /^(yes|true)$/i.test(String(data && data.trimDiscard != null ? data.trimDiscard : ""));
      if(f.trimSku) f.trimSku = stripSpaces(f.trimSku);
    }
    f.outputSku = stripSpaces(f.outputSku);        // PDF text comes through with stray spaces
    f.inputSku = stripSpaces(f.inputSku);
    if(f.outputSku2) f.outputSku2 = stripSpaces(f.outputSku2);
    f.issuedDate = todayISO();                     // new sheet, issued today
    f.referenceImages = photos || [];
    S.form = f; S.formId = null; S.view = "form";
    resetFormMeta(); markUnsaved();
    S.importBanner = (photos && photos.length)
      ? "Imported \u2014 " + photos.length + " photo" + (photos.length===1 ? "" : "s") + " came across from the Word file (check they're right for this product; some older sheets reuse a placeholder photo). Please check every field and complete the required tick-boxes."
      : "Imported \u2014 please check every field, then complete the required tick-boxes and add reference photos.";
    render(); window.scrollTo(0,0);
  }

    var mp = s.id ? S.specs.filter(function(x){
        return x.id !== s.id && normFurther(x.furtherOutputs).some(function(o){ return o.specId === s.id; });
      }).sort(function(a,b){ return (a.productName||"").localeCompare(b.productName||""); }) : [];
    if(!mp.length) return "";
    return '<tr><td class="lbl">Main product'+(mp.length>1?'s':'')+'</td><td>'+mp.map(function(x){
        return '<span class="ss-link" data-action="print" data-id="'+esc(x.id)+'" title="Open the main product spec">'+esc(x.productName||"(untitled)")+'</span>'
          + (x.outputSku ? ' <span style="color:#606060">('+esc(x.outputSku)+')</span>' : '')
          + (x.archived ? ' <i>(archived)</i>' : '');
      }).join("<br>")+'</td></tr>';
  }
  function fmtWt(v){
    v = (v == null ? "" : String(v)).trim();
    if(!v) return "\u2014";
    return /^\d+(\.\d+)?$/.test(v) ? v + " g" : v;         // "232" -> "232 g", "NA" stays "NA"
  }

  // ---- Retail printed sheet (layout follows the Retail Word template) ----
  function renderPrintableRetail(s){
    var out = '<div class="spec-sheet">';
    out += '<div class="title">PRODUCT CUTTING SPECIFICATION</div>';
    out += '<div class="subtitle">'+esc(s.productName||"")+'</div>';

    var fo = normFurther(s.furtherOutputs).filter(function(o){ return (o.label||"").trim() || o.specId; });
    function foHtml(o, i){
      var linked = o.specId ? S.specs.filter(function(x){ return x.id===o.specId; })[0] : null;
      var text = esc((o.label||"").trim() || (linked ? linked.productName : "") || "(linked spec)");
      if(linked) text = '<span class="ss-link" data-action="print" data-id="'+esc(o.specId)+'" title="Open this spec">'+text+'</span>';
      return (fo.length > 1 ? (i+1)+") " : "") + text;
    }
    // Trim: "To be discarded", or the trim SKU (a link if it is another Retail spec) + the instructions
    function trimRowHtml(){
      if(s.trimDiscard) return '<tr><td class="lbl">Trim</td><td><b>To be discarded</b></td></tr>';
      var sku = (s.trimSku||"").trim(), txt = (s.trimText||"").trim();
      if(!sku && !txt) return "";
      var linked = sku ? S.specs.filter(function(x){
          return x.id !== s.id && specChannel(x) === "retail" && [x.outputSku, x.outputSku2].some(function(k){ return k && k.toLowerCase() === sku.toLowerCase(); });
        })[0] : null;
      var skuHtml = sku ? '<b>' + (linked ? '<span class="ss-link" data-action="print" data-id="'+esc(linked.id)+'" title="Open this spec">'+esc(sku)+'</span>' : esc(sku)) + '</b>' : '';
      return '<tr><td class="lbl">Trim</td><td>'+skuHtml+(sku && txt ? ' \u2014 ' : '')+nl2br(txt)+'</td></tr>';
    }
    function skuLine(sku, desc){ return '<b>'+esc(sku||"\u2014")+'</b>' + (desc ? ' \u2014 '+esc(desc) : ''); }
    var outs = skuLine(s.outputSku, s.outputSageDesc);
    if(s.outputSku2 || s.outputSageDesc2) outs += '<br><span class="ss-andor">and/or</span><br>' + skuLine(s.outputSku2, s.outputSageDesc2);

    out += '<table class="ss-table">'
      + '<tr><td class="lbl">Input SKU</td><td>'+skuLine(s.inputSku, s.inputSageDesc)+'</td></tr>'
      + '<tr><td class="lbl">Primary Output SKU</td><td>'+outs+'</td></tr>'
      + (fo.length ? '<tr><td class="lbl">Further Output(s)</td><td>'+fo.map(foHtml).join("<br>")+'</td></tr>' : '')
      + mainProductsRowHtml(s)
      + trimRowHtml()
      + '<tr><td class="lbl">Issued / By</td><td>'+fmtDate(s.issuedDate) + ' \u00b7 Amended by <b>'+esc(s.issuedByInitials || s.writtenBy || "\u2014")+'</b>'
        + (isStale(s) ? ' <span style="color:#946200;font-weight:700">\u2014 \u26a0 over 1 year old, review recommended</span>' : '')
        + '</td></tr></table>';

    out += '<div class="ss-bar">1 CUTTING DETAILS</div>';
    if(s.cuttingNotes) out += '<table class="ss-table"><tr><td class="lbl">Cutting notes</td><td>'+nl2br(s.cuttingNotes)+'</td></tr></table>';
    function wb(label, val, note, cls){
      return '<td class="'+(cls||'mincell')+'"><span class="k">'+label+'</span><span class="v">'+esc(val)+'</span>'+(note ? '<span class="d">'+esc(note)+'</span>' : '')+'</td>';
    }
    out += '<div class="ss-wbtitle">Weight band \u2014 every steak must fall within this range:</div>';
    out += '<table class="ss-table ss-weightband wb4"><tr>'
      + wb("ABSOLUTE LEGAL MINIMUM", fmtWt(s.minWeight), s.toleranceNote)
      + wb("AVERAGE WEIGHT MINIMUM", fmtWt(s.avgWeightMin), s.avgWeightNote)
      + wb("TARGET WEIGHT (W)", fmtWt(s.targetWeight), "Advertised weight", "targetcell")
      + wb("MAXIMUM WEIGHT", fmtWt(s.maxWeight), "Do not exceed")
      + '</tr></table>';
    out += '<table class="ss-table">'
      + '<tr><td class="lbl">Input product condition</td><td>'+ssSelectedOnly(CONDITION_OPTS,s.inputCondition)+'</td></tr>'
      + '<tr><td class="lbl">Fat cover on finished product</td><td><b>'+esc(s.fatCover||"\u2014")+'</b></td></tr>'
      + '<tr><td class="lbl">Cutting machine</td><td>'+ssSelectedOnly(MACHINE_OPTS,s.cuttingMachine)+'</td></tr>'
      + (s.weightRecordingNote ? '<tr><td class="lbl">Weight recording</td><td>'+esc(s.weightRecordingNote)+'</td></tr>' : '')
      + '</table>';

    out += '<div class="ss-bar">2 PACKING INSTRUCTIONS</div>';
    var secondary = (s.secondaryPack === "other" && s.secondaryPackNote) ? '<b>'+esc(s.secondaryPackNote)+'</b>' : ssSelectedOnly(RT_SECONDARY_OPTS, s.secondaryPack);
    out += '<table class="ss-table">'
      + '<tr><td class="lbl">Packaging</td><td>'+ssSelectedOnly(PACKAGING_OPTS,s.packagingType)+'</td></tr>'
      + '<tr><td class="lbl">Position in tray</td><td>'+esc(s.positionInTray||"\u2014")+'</td></tr>'
      + '<tr><td class="lbl">Packing preparation</td><td>'+esc(s.packingPrep||"\u2014")+'</td></tr>'
      + '<tr><td class="lbl">Label type - Cutting plant</td><td>'+ssSelectedOnly(RT_LABEL_CP_OPTS,s.labelCuttingPlant)+'</td></tr>'
      + '<tr><td class="lbl">Secondary Packaging - Warehouse</td><td>'+secondary+'</td></tr>'
      + '<tr><td class="lbl">Label type - Warehouse</td><td>'+ssSelectedOnly(RT_LABEL_WH_OPTS,s.labelWarehouse)+'</td></tr>'
      + '</table>';

    out += '<div class="ss-bar">3 FINISHED PRODUCT DETAILS</div>';
    out += '<table class="ss-table"><tr><td class="lbl">Finished product state</td><td>'+ssSelectedOnly(RT_FINISHED_OPTS,s.finishedState)+'</td></tr></table>';

    out += refImagesHtml(s);
    out += sheetFooterHtml(s);
    out += '</div>';
    return out;
  }

  function cancelDelete(){ S.confirmDelete = null; render(); }

  // navigation that could lose typed-in work goes through tryLeave() (asks first if there are unsaved changes)
  window.goLibrary=function(){ tryLeave(goLibrary); };
  window.goNew=function(){ tryLeave(goNew); };
  window.goImport=function(){ tryLeave(goImport); };
  window.goHome=function(){ tryLeave(goHome); };
  window.startNew=startNew;
  window.cancelChooseChannel=function(){ S.chooseChannel=false; render(); };
  window.goManageGroups=function(){ tryLeave(goManageGroups); };
  window.goEdit=goEdit; window.goPrint=goPrint;
  window.saveSpec=saveSpec; window.doPrint=doPrint; window.loadSpecs=loadSpecs; window.S=S; window.render=render;
  window.performDelete=performDelete; window.cancelDelete=cancelDelete;

  (function boot(){
    var appEl = document.getElementById("app");
    if(appEl) appEl.addEventListener("click", onAppClick);
    document.addEventListener("keydown", function(e){
      if(e.key === "Escape"){
        if(S.lightbox){ closeLightbox(); }
        else if(S.confirmDelete){ cancelDelete(); }
        else if(S.confirmLeave){ confirmLeaveStay(); }
        else if(S.chooseChannel){ cancelChooseChannel(); }
      }
    });
    window.addEventListener("beforeunload", function(e){
      if(isFormDirty()){ e.preventDefault(); e.returnValue = ""; }
    });
    render();
    loadSpecs();
    loadGroupOptions();
  })();
})();
</script>
</body>
</html>
